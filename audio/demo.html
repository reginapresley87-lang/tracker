<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracker sounds</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;padding:20px}button{margin:6px;padding:12px 16px;font-size:16px;border-radius:12px;border:1px solid #ccc}</style></head>
<body><h1>Tracker sounds</h1><div id="b"></div>
<p>Volume <input id="v" type="range" min="0" max="1" step="0.05" value="0.6"> <label><input id="m" type="checkbox"> Mute</label></p>
<footer>Made by Nova Labs ⭐</footer>
<script src="audio.js"></script>
<script>
var A=window.TRACKER_AUDIO;A.tap();A.init();
['tap','inviteSent','ringStart','ringStop','verified','accepted','declined','arrived','left','sharingStopped','error'].forEach(function(n){
 var x=document.createElement('button');x.textContent=n;x.id='btn-'+n;x.onclick=function(){A[n]()};document.getElementById('b').appendChild(x);});
document.getElementById('v').oninput=function(e){A.setVolume(e.target.value)};
document.getElementById('m').onchange=function(e){A.mute(e.target.checked)};
</script></body></html>
